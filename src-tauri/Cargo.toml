[package]
name = "nimiapp-realm-persona-studio"
version = "0.1.0"
description = "Realm Persona Studio — Owner-facing creation and operation desktop app for user-owned public Realm Personas."
authors = ["Nimi Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
