app_id: nimi.realm-persona-studio
display_name: Realm Persona Studio
version: 0.1.5
profile: standalone
manifest_role: submitted-input
app_access:
  - realm.data
  - runtime.consume
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1450
metadata:
  summary: 创建和管理自己的 Realm Persona，维护角色资料与创作草稿。
  icon: src/shell/renderer/assets/brand/studio-logo.png
  readme: APP_GUIDE.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-realm-persona-studio
  support_url: https://github.com/nimiplatform/nimiapp-realm-persona-studio/issues
capability_contract_refs:
  - text.generate
  - image.generate
  - audio.synthesize
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: publishable
        publication_control: user-confirmed
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: image
        exposure: publishable
        publication_control: user-confirmed
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: true
    telemetry: []
    third_party_account: none
    user_content_sharing: public
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Electron userData>/Local Storage/**
      purpose: Language preference only. Realm remains authoritative for Persona records.
      expected_size_band: Typically KiB to a few MiB of JSON, subject to browser storage quota.
    - path_pattern: <Nimi protected App storage>/**
      purpose: Creation and post drafts, local schedules, creative-asset history, imported artifact metadata and theme preference through protected App operations. Media bytes remain in Runtime artifact custody.
      expected_size_band: JSON metadata is typically KiB to a few MiB; imported image files in Runtime custody are limited to 8 MiB each.
