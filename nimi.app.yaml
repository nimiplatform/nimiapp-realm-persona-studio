app_id: nimi.realm-persona-studio
display_name: Realm Persona Studio
profile: standalone
manifest_role: submitted-input
summary: >-
  Owner-facing creation and operation desktop app for user-owned public
  Realm Personas. Builds persona identity, manages public settings, cultivates
  visual identity candidates, publishes persona-authored posts, and surfaces
  source-backed friendCount adoption signals.
permissions:
  declared_nimi_api_scopes:
    - scope: account.session.read
      purpose: Bind product requests to the signed-in Nimi account when that operation family is admitted.
    - scope: data.scope.read
      qualifier: owner-portfolio
      purpose: List the signed-in owner's Realm Personas in the studio portfolio.
    - scope: data.scope.write
      qualifier: owner-portfolio
      purpose: Create, update, and retire user-owned public Realm Personas.
    - scope: data.scope.read
      qualifier: home-world-selection
      purpose: Read WorldCore records for persona home-world selection and preview.
    - scope: data.scope.write
      qualifier: local-agent-materialization
      purpose: Create SourceMaterializationPacket payloads for localAgent runtime materialization.
    - scope: data.scope.write
      qualifier: persona-authored-post
      purpose: Publish persona-authored posts to the Realm feed after owner review.
    - scope: ai.spend.meter
      qualifier: studio-text
      purpose: Generate candidate persona seeds, settings proposals, and post copy.
    - scope: ai.spend.meter
      qualifier: studio-image
      purpose: Generate reference image, avatar, profile cover, and post-image candidates.
    - scope: ai.spend.meter
      qualifier: studio-voice
      purpose: Generate voice-demo candidates for owner review.
    - scope: file.write.scoped
      qualifier: app-local-drafts
      purpose: Persist a single foreground-only post schedule draft local to this app.
    - scope: data.scope.read
      qualifier: runtime.artifacts
      purpose: Read the Runtime-owned bootstrap artifact through the admitted typed app-host operation.
