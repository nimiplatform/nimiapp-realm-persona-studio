app_id: nimi.realm-persona-studio
display_name: Realm Persona Studio
profile: standalone
manifest_role: submitted-input
summary: >-
  Owner-facing creation and operation desktop app for user-owned public
  Realm Personas. Builds persona identity, manages public settings, cultivates
  visual identity candidates, publishes persona-authored posts, and surfaces
  source-backed friendCount adoption signals.
permissions:
  - id: ai.text.generate
    reason: Generate owner-reviewed Realm Persona draft candidates from the owner's description.
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1450
