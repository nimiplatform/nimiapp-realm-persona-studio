format: nimicoding.authority/v2
owner: team.realm-persona-studio
scope: realm-persona-studio.runtime-ai
units:
  - id: definition.realm-persona-studio.runtime-ai.ai-config-operations
    kind: definition
    title: AI configuration operations
    meaning: Studio accesses its exact Runtime-owned App AIConfig through the Desktop-supervised protected standard bridge. Its covered self-owner manager provides get, bounded options, and whole-object revision-CAS overwrite without an owner selector. Studio may configure in-App or request that Desktop open the same canonical App configuration; Desktop is a centralized but non-exclusive manager.
  - id: rule.realm-persona-studio.runtime-ai.r001
    kind: rule
    title: Runtime candidate generation
    modality: must
    statement: Runtime text, image, and speech calls are candidate-generation surfaces rather than Realm authority.
    condition: Whenever Studio invokes a Runtime text, image, or speech call.
    failure: Keep returned material local and reject any Realm authority claim for it.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-candidate
  - id: rule.realm-persona-studio.runtime-ai.r002
    kind: rule
    title: Materialization source reference
    modality: must
    statement: Studio local candidates may identify their canonical source as personaCharacter with worldId, sourceId, and sourceContentHash, but Studio invokes no SourceMaterializationPacket operation until a future exact App operation is admitted.
    condition: Whenever Studio prepares local source context or materialization is requested.
    failure: Preserve only the local candidate reference and return capability-unavailable before any materialization call.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.source-materialization-packet
  - id: rule.realm-persona-studio.runtime-ai.r003
    kind: rule
    title: No materialization write-back
    modality: must_not
    statement: A local candidate or future SourceMaterializationPacket payload mutates PersonaCharacter instead of using the admitted owner create or replace operation.
    condition: Always.
    failure: Reject the mutation and leave PersonaCharacter unchanged.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.source-materialization-packet
  - id: rule.realm-persona-studio.runtime-ai.r004
    kind: rule
    title: LocalAgent chat readiness
    modality: must
    statement: localAgent chat readiness remains unavailable until an exact SourceMaterializationPacket App operation exists and may then use only owner-visible fields.
    condition: Whenever Studio generates localAgent chat readiness.
    failure: Return runtime input unavailable when the packet is missing or a field is not owner-visible.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-agent
      - type: applies_to
        target: definition.realm-persona-studio.core.source-materialization-packet
  - id: rule.realm-persona-studio.runtime-ai.r005
    kind: rule
    title: No private LocalAgent input
    modality: must_not
    statement: Studio sends private LocalAgent memory, emotions, cognition, private transcript, or app-specific memory fragments to Runtime candidate workflows.
    condition: Always.
    failure: Reject the Runtime request before transport and expose none of the private state.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-agent
  - id: rule.realm-persona-studio.runtime-ai.r006
    kind: rule
    title: Forbidden Runtime proposal fields
    modality: must_not
    statement: Runtime proposals include provider, model, lifecycle, owner override, hidden world override, raw rules, or canonical id creation.
    condition: Always.
    failure: Reject the proposal and add none of its forbidden fields to local candidate state.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-candidate
  - id: rule.realm-persona-studio.runtime-ai.r007
    kind: rule
    title: Explicit Runtime failures
    modality: must
    statement: Runtime route-unbound, transport-unavailable, malformed-output, and invalid-payload states are explicit failures.
    condition: Whenever a listed Runtime state occurs.
    failure: Render the corresponding explicit failure and return no Runtime candidate success.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-core-surfaces
  - id: rule.realm-persona-studio.runtime-ai.r008
    kind: rule
    title: Owner-accepted output boundary
    modality: must
    statement: Runtime output accepted by the owner still requires the admitted complete PersonaCharacter replacement before it becomes source state.
    condition: Whenever an owner accepts Runtime output.
    failure: Keep the accepted output as a local candidate until the admitted Realm core replacement succeeds.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-candidate
  - id: rule.realm-persona-studio.runtime-ai.r009
    kind: rule
    title: No app-owned Runtime auth
    modality: must_not
    statement: Studio logs in, opens OAuth, exchanges tokens, stores sessions, refreshes tokens, or accesses tokens instead of consuming host-owned Desktop shared Runtime account state.
    condition: Always.
    failure: Return capability-unavailable when host-owned Desktop shared Runtime account state is missing and expose no app-owned authentication fallback.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.standard-shell
  - id: rule.realm-persona-studio.runtime-ai.r010
    kind: rule
    title: Forbidden Runtime transports
    modality: must_not
    statement: Studio implements custom Realm unary transport, generic Runtime bridge access, auth envelopes, caller metadata, Runtime app registration, renderer launch binding, or Runtime defaults bootstrap instead of using an admitted public SDK or Kit protected operation delivered through the Desktop-supervised standard bridge.
    condition: Always.
    failure: Return capability-unavailable before transport and expose no custom or generic fallback.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.standard-shell
  - id: rule.realm-persona-studio.runtime-ai.r011
    kind: rule
    title: AI configuration capability gate
    modality: must
    statement: Studio uses only its covered self-owner AIConfig manager for canonical get, bounded options, and whole-object revision-CAS overwrite. It may expose direct App configuration, request that Nimi Desktop open the same canonical owner, or choose only the Desktop handoff as a UI composition; none of those choices creates authorization or makes Desktop a configuration precondition. The App id on Desktop navigation is only a target, Desktop independently resolves the projected owner, and Studio creates no app-local provider token custody, model registry truth, shadow configuration, implicit selection, fallback, or model availability simulation.
    condition: Whenever Studio reads or changes AI provider or model configuration or requests that Desktop open configuration.
    failure: Fail closed when the covered self-owner manager or an invoked optional Desktop navigation is unavailable; preserve owner drafts and canonical committed intent without creating a parallel configuration path.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.runtime-ai.ai-config-operations
  - id: rule.realm-persona-studio.runtime-ai.r012
    kind: rule
    title: Source-backed voice selection
    modality: must
    statement: Voice candidate generation requires an explicit owner selection from client.aiConfig.listOptions with kind preset-voices for the current App audio configuration and submits that exact presetVoiceId through the protected speech-synthesize operation; Studio never invents a voice or writes the candidate selection into PersonaCharacter source state.
    condition: Whenever Studio prepares or submits a voice candidate.
    failure: Preserve the script and render voice selection unavailable or required when the source list cannot be read, the selected voice is missing, or Runtime rejects it; make no audio generation or public voice claim.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.runtime-ai.ai-config-operations
