format: nimicoding.authority/v2
owner: team.realm-persona-studio
scope: realm-persona-studio.persona
units:
  - id: definition.realm-persona-studio.persona.create-dto
    kind: definition
    title: Persona create DTO
    meaning: The Studio create input is the exact App SDK PersonaCharacter input containing worldId, writable visibility private, unlisted, or public, origin, and an owner-reviewed PersonaCharacter profile input without caller identity, id, profileHash, or profileCoverage.
  - id: definition.realm-persona-studio.persona.replace-dto
    kind: definition
    title: Persona replace DTO
    meaning: The Studio replace input contains personaCharacterId, the latest lower-case sixty-four-hex baseContentHash, worldId, writable visibility, origin, and a complete profile produced from the latest detail through client.realm.personaCharacter.toProfileInput.
  - id: definition.realm-persona-studio.persona.world-character-core
    kind: definition
    title: World character core
    meaning: WorldCharacterCore objects are world-created characters maintained by Realm World Studio, not owner personas.
  - id: rule.realm-persona-studio.persona.r001
    kind: rule
    title: Canonical persona identity
    modality: must
    statement: A Studio persona exists only after client.realm.personaCharacter.create returns a canonical PersonaCharacter id, worldId, contentHash, and contentRevision.
    condition: Whenever Studio claims that a persona exists.
    failure: Return persona creation without success when the App client returns no complete canonical PersonaCharacter identity.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r002
    kind: rule
    title: Canonical detail object
    modality: must
    statement: The canonical detail object is the sanitized owner PersonaCharacter projection from client.realm.personaCharacter.getOwned.
    condition: Whenever Studio presents persona detail as source-backed.
    failure: Render persona detail unavailable with the exact sanitized reasonCode when getOwned returns no canonical projection.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r003
    kind: rule
    title: Canonical list object
    modality: must
    statement: The canonical owner list is the complete ordered union of client.realm.personaCharacter.listOwned pages followed through nextAfterId until no successor remains.
    condition: Whenever Studio presents the owner persona list as source-backed.
    failure: Fail the whole portfolio read on an invalid or repeated cursor and never present one page as the complete owner list.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r004
    kind: rule
    title: Preserve Realm fields
    modality: must
    statement: id, worldId, schemaVersion, contentHash, contentRevision, sourceHash, visibility, origin, profile, validity, materializationReadiness, createdAt, and updatedAt are preserved from the App projection without local canonicalization, while state and ownerAccountId are never synthesized or stored.
    condition: Whenever Studio consumes a PersonaCharacter App projection.
    failure: Reject the locally reinterpreted object and do not present it as canonical source state.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r005
    kind: rule
    title: Persona core source fields
    modality: must
    statement: Display name, handle, greeting, narrative, resource references, display-safe HTTPS external references, and extension envelopes are read only from their canonical PersonaCharacter profile locations, while top-level visibility remains distinct from profile content.
    condition: Whenever a listed field is present in a PersonaCharacter projection.
    failure: Do not claim the field as source-backed when it is absent from the canonical PersonaCharacter projection.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r006
    kind: rule
    title: Missing optional persona fields
    modality: must
    statement: Missing optional fields render as unavailable or empty source-backed fields; Studio does not synthesize persona identity.
    condition: Whenever an optional persona field is missing.
    failure: Render the field as unavailable or source-backed empty and emit no synthesized persona identity.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r007
    kind: rule
    title: Owner-scope proof
    modality: must
    statement: Owner scope is proven only by the Runtime-mediated listOwned, getOwned, create, or replace App operation under the current protected session.
    condition: Whenever Studio requires proof of owner scope.
    failure: Treat owner authority as missing or access denied when the owner App operation does not return the object for the current account session.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
  - id: rule.realm-persona-studio.persona.r008
    kind: rule
    title: Exclude world characters
    modality: must_not
    statement: WorldCharacterCore objects appear as owner personas in the owner portfolio.
    condition: Always.
    failure: Exclude the WorldCharacterCore object from the owner portfolio and present no owner-persona claim for it.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-persona
      - type: applies_to
        target: definition.realm-persona-studio.persona.world-character-core
  - id: rule.realm-persona-studio.persona.r009
    kind: rule
    title: Persona creation surface
    modality: must
    statement: Persona creation calls client.realm.personaCharacter.create with exact worldId, owner-selected writable visibility, origin, and reviewed profile input.
    condition: Whenever Studio submits persona creation.
    failure: Reject persona creation when the call or any listed field is missing.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.persona.create-dto
  - id: rule.realm-persona-studio.persona.r010
    kind: rule
    title: Persona replacement surface
    modality: must
    statement: Persona replacement calls client.realm.personaCharacter.replace with the latest baseContentHash and a complete profile produced by client.realm.personaCharacter.toProfileInput from the latest detail.
    condition: Whenever Studio submits persona replacement.
    failure: Reject persona replacement when the latest baseContentHash is absent or stale.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.persona.replace-dto
  - id: rule.realm-persona-studio.persona.r011
    kind: rule
    title: Replacement success identity
    modality: must
    statement: A replace success is valid only when the App client returns the updated canonical PersonaCharacter with its canonical contentHash and contentRevision.
    condition: Whenever Studio presents persona replacement as successful.
    failure: Treat replacement as failed when the App client returns no complete updated PersonaCharacter projection.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.persona.replace-dto
  - id: rule.realm-persona-studio.persona.r012
    kind: rule
    title: Post-write canonical refresh
    modality: must
    statement: Studio re-reads or refreshes canonical detail after writes before presenting updated source-backed state.
    condition: After a persona write succeeds.
    failure: Withhold updated source-backed state until canonical detail is re-read or refreshed.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.realm-core-surfaces
  - id: rule.realm-persona-studio.persona.r013
    kind: rule
    title: No candidate canonicalization
    modality: must_not
    statement: Local drafts, Runtime proposals, or media candidates become the canonical persona object by themselves.
    condition: Always.
    failure: Retain the material as a local candidate and present no canonical persona success.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.local-candidate
