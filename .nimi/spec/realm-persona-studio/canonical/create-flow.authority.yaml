format: nimicoding.authority/v2
owner: team.realm-persona-studio
scope: realm-persona-studio.create-flow
units:
  - id: definition.realm-persona-studio.create-flow.persona-archetype
    kind: definition
    title: Persona archetype vocabulary
    meaning: An owner-reviewed closed archetype vocabulary whose values match the implementation PERSONA_ARCHETYPES (CARING, PLAYFUL, INTELLECTUAL, CONFIDENT, MYSTERIOUS, ROMANTIC); selected values are stored in the reviewed persona core narrative area, while bilingual UI labels are presentation and the value set is product truth.
  - id: definition.realm-persona-studio.create-flow.persona-traits
    kind: definition
    title: Persona traits vocabulary
    meaning: An owner-reviewed closed 12-value trait vocabulary matching the implementation PERSONA_TRAITS (HUMOROUS, SARCASTIC, GENTLE, DIRECT, OPTIMISTIC, REALISTIC, DRAMATIC, PASSIONATE, REBELLIOUS, INNOCENT, WISE, ECCENTRIC); the subset selected by the owner is stored in the reviewed core.
  - id: definition.realm-persona-studio.create-flow.core-concept
    kind: definition
    title: Core concept
    meaning: A one-line core concept text in the creation flow that is normalized into an admitted owner-reviewed profile description or identity summary field and is not a new core field.
  - id: definition.realm-persona-studio.create-flow.draft-autosave-record
    kind: definition
    title: Draft autosave record
    meaning: A local autosave record for a creation draft containing draft fields, a draft key, and a local timestamp; it is persisted on the desktop and is candidate material only.
  - id: definition.realm-persona-studio.create-flow.creation-draft-history
    kind: definition
    title: Creation draft history
    meaning: A local list of creation drafts and candidates organized by draft key and local timestamp for listing and reopening local work.
  - id: definition.realm-persona-studio.create-flow.portrait-variant-set
    kind: definition
    lifecycle: removed
    title: Portrait variant set
    reason: The owner removed the image-candidate slot module from the reviewed creation surface.
  - id: definition.realm-persona-studio.create-flow.generation-prompt-view
    kind: definition
    title: Generation prompt view
    meaning: Owner-visible prompt content consisting only of owner-written description or supplemental text and admitted candidate prompt text.
  - id: definition.realm-persona-studio.create-flow.reference-image-prompt-input
    kind: definition
    title: Reference image prompt input
    meaning: An owner-editable local image-generation input initialized from the prior describe-stage owner prompt, persisted with the local creation draft, and snapshotted into each generated image candidate.
  - id: definition.realm-persona-studio.create-flow.ai-seed-generation-mode
    kind: definition
    title: AI seed generation mode
    meaning: A single AI draft-generation capability whose behavior sits on a continuum derived from owner input volume; with no owner input it invents a complete draft (creative), with owner input it completes around that input (completion), and the mode is derived rather than an owner-facing switch.
  - id: definition.realm-persona-studio.create-flow.ai-description-candidate
    kind: definition
    title: AI description candidate
    meaning: A candidate character description text generated on explicit owner reroll action and written back into the owner-editable describe input, optionally constrained by owner-written supplements and directed away from the previously shown idea; it is idea material only and carries no substantive persona fields.
  - id: rule.realm-persona-studio.create-flow.r001
    kind: rule
    title: Closed persona archetype validation
    modality: must
    statement: Create-readiness validation requires the persona archetype to come from the closed value set.
    condition: When building the reviewed create payload.
    failure: Block creation with an explicit failure when the archetype is missing or outside the closed value set; do not inject a default value.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.persona-archetype
  - id: rule.realm-persona-studio.create-flow.r002
    kind: rule
    title: Closed persona trait validation
    modality: must
    statement: Persona trait selection contains at most 3 values and every value comes from the closed value set.
    condition: During draft editing and create-readiness validation.
    failure: Fail closed with a hard failure, not a warning, when more than 3 traits are selected or any trait is outside the closed value set.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.persona-traits
  - id: rule.realm-persona-studio.create-flow.r003
    kind: rule
    title: Admitted core concept field
    modality: must
    statement: The core concept text is normalized into an admitted owner-reviewed profile description or identity summary field only.
    condition: When normalizing the payload.
    failure: Reject the payload if it produces a new non-admitted core field.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.core-concept
  - id: rule.realm-persona-studio.create-flow.r004
    kind: rule
    title: Typed autosave status
    modality: must
    statement: The autosave indicator reflects the typed result of local persistence.
    condition: Whenever any save status is displayed.
    failure: A persistence failure must render an explicit save-failed state and must never imply success.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.draft-autosave-record
  - id: rule.realm-persona-studio.create-flow.r005
    kind: rule
    title: No Realm or public autosave claim
    modality: must_not
    statement: An autosaved draft claims Realm or public status.
    condition: Always.
    failure: Treating the draft as authority is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.draft-autosave-record
  - id: rule.realm-persona-studio.create-flow.r006
    kind: rule
    title: Local draft history only
    modality: must
    statement: The history panel lists only local drafts and candidates for listing and reopening.
    condition: When the history panel is rendered or interacted with.
    failure: Reject any restore or rollback operation on an already-created persona.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.creation-draft-history
  - id: rule.realm-persona-studio.create-flow.r007
    kind: rule
    lifecycle: removed
    title: Progressive portrait candidate slots
    reason: The owner removed the four-slot image-candidate module from the reviewed creation surface.
  - id: rule.realm-persona-studio.create-flow.r008
    kind: rule
    lifecycle: removed
    title: Local portrait candidate operations
    reason: The owner removed the multi-candidate selection and slot-regeneration module from the reviewed creation surface.
  - id: rule.realm-persona-studio.create-flow.r009
    kind: rule
    title: Prompt view boundary
    modality: must_not
    statement: The prompt view exposes provider, model, routing, lifecycle, or system-injected content, or provides rule editing.
    condition: Always.
    failure: Treat the view as defective when such content or editing capability appears; the view supports viewing and copying only.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.generation-prompt-view
  - id: rule.realm-persona-studio.create-flow.r010
    kind: rule
    title: OASIS world recommendation
    modality: must
    statement: The world selector recommended group contains only OASIS default worlds resolved from WorldCore data and places them first; ordering is local presentation, not a product ranking.
    condition: When rendering the world selector.
    failure: When WorldCore is unavailable, render world-core-selection-unavailable and block submission.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.core.world-core
  - id: rule.realm-persona-studio.create-flow.r011
    kind: rule
    title: Owner-controlled reference image prompt
    modality: must
    statement: The reference image prompt is initialized from the prior owner prompt only when it is empty, remains independently editable and local, and is submitted only after an explicit owner generate or regenerate action.
    condition: During the reviewed create stage and every reference image generation action.
    failure: Automatic generation, overwriting an owner edit through live synchronization, submitting an empty prompt, or using a prompt different from the visible submitted snapshot is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.reference-image-prompt-input
  - id: rule.realm-persona-studio.create-flow.r012
    kind: rule
    title: AI seed output stays candidate
    modality: must
    statement: AI seed output at any input volume, including zero input, is candidate material and enters the reviewed create stage only as an owner-editable local draft; generation is never blocked solely because the owner provided no input.
    condition: Whenever AI seed generation runs in the creation flow.
    failure: Treating unreviewed AI output as submittable truth, auto-submitting it, or refusing to run on empty owner input is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.ai-seed-generation-mode
  - id: rule.realm-persona-studio.create-flow.r013
    kind: rule
    title: Owner input precedence over AI seed
    modality: must
    statement: Owner-written description and supplements are generation constraints and are never overwritten by AI seed output; candidate text fills only the fields the owner left empty.
    condition: When merging AI seed output into the local creation draft.
    failure: Overwriting owner-written input with candidate output is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.ai-seed-generation-mode
  - id: rule.realm-persona-studio.create-flow.r014
    kind: rule
    title: AI seed must not replace source-backed decisions
    modality: must_not
    statement: AI seed output decides world selection, handle availability, visibility, or reference image adoption on the owner's behalf.
    condition: Always.
    failure: Auto-selecting a world, bypassing the owner-portfolio handle availability check, or submitting without the reviewed checks is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.ai-seed-generation-mode
  - id: rule.realm-persona-studio.create-flow.r015
    kind: rule
    title: Description reroll stays owner-controlled
    modality: must
    statement: An AI description candidate replaces the describe-input text only on an explicit owner reroll action, remains owner-editable, and never populates substantive persona fields or advances the creation stage by itself; a generation failure preserves the owner's current text.
    condition: Whenever AI description reroll runs in the creation flow.
    failure: Silent replacement without an owner action, writing candidate persona fields, auto-advancing the stage, or destroying the owner's text on failure is a defect.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.create-flow.ai-description-candidate
