format: nimicoding.authority/v2
owner: team.realm-persona-studio
scope: realm-persona-studio.setting
units:
  - id: definition.realm-persona-studio.setting.core-field-map
    kind: definition
    title: Persona core field map
    meaning: The admitted owner-reviewed PersonaCharacter field map contains presentation.displayName, identity.name, identity.handle, identity.summary, presentation.profileLine, interactionProfile.greeting, narrative, the required CharacterLorebookDeclarationV1 identity, behavior, speaking, immutable-boundary, and optional relationship-posture fields, top-level visibility, stable resource references, and display-safe HTTPS assets.externalRefs; Studio-specific ownerSettings or socialVisibility extensions are not canonical fields.
  - id: definition.realm-persona-studio.setting.lorebook-declaration-field-map
    kind: definition
    title: Persona Character lorebook declaration field map
    meaning: Persona Studio exposes the Realm-owned CharacterLorebookDeclarationV1 as owner-reviewed compact identity, behavior, speaking, immutable-boundary, and optional relationship-posture rows on PersonaCharacter create and replace; Realm exclusively owns canonical source persistence and Packet issuance, Forge owns the unique executable schema, bounds and reference validation, normalization, hash, readiness, and Packet contract behavior, and Studio owns neither authority.
  - id: rule.realm-persona-studio.setting.r001
    kind: rule
    title: Display name field
    modality: must
    statement: displayName is read and written as PersonaCharacter profile.presentation.displayName with profile.identity.name kept complete for replacement.
    condition: Whenever Studio reads or writes the persona display name.
    failure: Treat the display name as unavailable or invalid when the canonical PersonaCharacter profile fields cannot supply it.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r002
    kind: rule
    title: Handle field
    modality: must
    statement: handle is admitted as PersonaCharacter profile.identity.handle during create and replacement when owner-reviewed.
    condition: Whenever Studio creates or replaces an owner-reviewed handle.
    failure: Reject the handle write when it is not owner-reviewed or cannot be normalized to profile.identity.handle.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r003
    kind: rule
    title: Profile description field
    modality: must
    statement: description and bio normalize to PersonaCharacter profile.identity.summary and presentation.profileLine.
    condition: Whenever Studio reads or writes description or bio.
    failure: Reject the write when description or bio cannot be normalized to an owner-reviewed profile description.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r004
    kind: rule
    title: Greeting field
    modality: must
    statement: greeting is admitted as profile.interactionProfile.greeting.
    condition: Whenever Studio reads or writes a greeting.
    failure: Reject the greeting write when the field is not owner-reviewed or cannot be stored in interactionProfile.greeting.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r005
    kind: rule
    title: Structured persona sections
    modality: must
    statement: Archetype, traits, and narrative summary use profile.narrative; owner-reviewed compact behavior, speaking, immutable-boundary, and relationship-posture source data use CharacterLorebookDeclarationV1; Studio creative personality, positioning, and other unmapped natural-language intent fields remain local candidates unless a registered Realm extension envelope is separately admitted.
    condition: Whenever Studio reads or writes a listed section.
    failure: Keep an unregistered or unmapped section local and omit it from PersonaCharacter replacement.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
      - type: applies_to
        target: definition.realm-persona-studio.setting.lorebook-declaration-field-map
  - id: rule.realm-persona-studio.setting.r006
    kind: rule
    title: Canonical visibility field
    modality: must
    statement: Persona visibility is the top-level PersonaCharacter visibility private, unlisted, public, or system; Studio writes only private, unlisted, or public and never introduces FRIENDS or maps unlisted to FRIENDS.
    condition: Whenever Studio reads or writes persona visibility.
    failure: Reject a write using system, FRIENDS, uppercase social visibility, or any non-canonical value.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r007
    kind: rule
    title: Profile media fields
    modality: must
    statement: avatarResourceRef and profileCoverResourceRef remain stable resource identifiers rather than URLs; only reviewed display-safe HTTPS assets.externalRefs may render as public external URLs, and local preview or artifact URIs remain local candidates.
    condition: Whenever Studio stores or previews a listed profile media field.
    failure: Keep unreviewed media local and expose no public asset authority claim for a local preview.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r008
    kind: rule
    title: Voice publication boundary
    modality: must
    statement: Voice settings may be read or proposed from core, but public voice publication requires an admitted Realm write path.
    condition: Whenever Studio reads, proposes, or publishes voice settings.
    failure: Keep the voice setting as a local candidate and expose no public voice publication when no admitted Realm write succeeds.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r009
    kind: rule
    title: Complete setting replacement
    modality: must
    statement: Every setting write uses the latest owner PersonaCharacter detail, calls client.realm.personaCharacter.toProfileInput, applies only canonical native field changes including the complete owner-reviewed CharacterLorebookDeclarationV1, and builds the complete exact replace input.
    condition: Whenever Studio prepares a setting write.
    failure: Reject the setting write when the replacement DTO is incomplete or not built from the latest detail read.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.persona.replace-dto
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r010
    kind: rule
    title: Required replacement fields
    modality: must
    statement: The setting write includes personaCharacterId, latest baseContentHash, worldId, writable visibility, origin, complete profile input, and complete CharacterLorebookDeclarationV1 with explicit optional relationship-posture rows.
    condition: Whenever Studio submits a setting write.
    failure: Reject the write before submission when any listed field is missing.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.persona.replace-dto
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r011
    kind: rule
    title: Forbidden setting payload
    modality: must_not
    statement: A setting write submits raw rule text, provider or model configuration, LocalAgent state, private transcript, unreviewed generated JSON, output-only profileHash or profileCoverage, bare ownerSettings or socialVisibility extensions, caller authority fields, or a system visibility write.
    condition: Always.
    failure: Reject the setting write before any Realm call.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r012
    kind: rule
    title: Runtime setting candidates
    modality: must
    statement: Runtime setting proposals remain editable candidates and return to the same owner-reviewed save path.
    condition: Whenever Runtime proposes a setting.
    failure: Keep the proposal local and do not save it as source state outside the owner-reviewed path.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r013
    kind: rule
    title: No-change setting result
    modality: must
    statement: A no-change diff returns a no-op failure state rather than a fake Realm write success.
    condition: Whenever a setting diff contains no change.
    failure: Return the no-op failure state and make no Realm write success claim.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r014
    kind: rule
    title: Setting validation failure
    modality: must
    statement: Invalid canonical visibility, malformed profile input, unsafe external references, and stale baseContentHash fail closed with the sanitized App reasonCode.
    condition: Whenever a setting payload contains an invalid visibility value, malformed structured field, or stale hash.
    failure: Reject the payload before any Realm write.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.core-field-map
  - id: rule.realm-persona-studio.setting.r015
    kind: rule
    title: Character lorebook declaration authoring is bounded
    modality: must
    statement: Persona Studio requires one compact identity statement, one to six behavior principles, one to four speaking principles, and one to six immutable boundaries, permits zero to four explicit relationship postures with a selected resolvable target or relationship, enforces the Realm-owned Unicode-scalar, row-count, and total declaration bounds, and treats an explicit empty optional relationship-posture list as valid source data.
    condition: Whenever an owner creates, reviews, clears, or replaces a PersonaCharacter lorebook declaration.
    failure: Keep the owner draft and reject create or replace before the Realm call when the declaration container or required content is missing, a reference is unresolved, or a bound is exceeded; never infer another profile or narrative field or inject a default.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.lorebook-declaration-field-map
  - id: rule.realm-persona-studio.setting.r016
    kind: rule
    title: Canonical save confirms lorebook declarations
    modality: must
    statement: Persona Studio reports Character lorebook declaration save success only from the canonical PersonaCharacter object returned by the existing Realm create or replace operation and reprojects the returned declaration without owning LocalAgent materialization, Cognition, prompt, or post-birth source adoption.
    condition: Whenever a PersonaCharacter create or setting replacement includes a CharacterLorebookDeclarationV1.
    failure: Preserve the reviewed draft and present the typed Realm validation, conflict, unavailable, or missing-canonical-object failure without local success or fallback.
    relations:
      - type: applies_to
        target: definition.realm-persona-studio.setting.lorebook-declaration-field-map
