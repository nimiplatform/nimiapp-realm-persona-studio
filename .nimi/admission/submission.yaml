app_id: nimi.realm-persona-studio
display_name: Realm Persona Studio
version: 0.1.2
profile: standalone
npm_package_name: nimiapp-realm-persona-studio
cargo_package_name: nimiapp-realm-persona-studio-shell
tauri_identifier: ai.nimi.apps.nimi.realm-persona-studio
package_author: Nimi Team
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - image.generate
  - audio.synthesize
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Electron userData>/Local Storage/**
      purpose: Owner draft schedules, creative-asset history references and language preference. Realm remains authoritative for Persona records. Retained after Nimi uninstall.
      expected_size_band: Typically KiB to a few MiB of JSON, subject to browser storage quota.
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: https://github.com/nimiplatform/nimiapp-realm-persona-studio/issues
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
