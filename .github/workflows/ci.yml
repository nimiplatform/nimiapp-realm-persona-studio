name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec-and-typescript:
    name: Spec + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: App configuration
        run: pnpm validate

      - name: nimicoding doctor
        run: pnpm nimicoding:doctor

      - name: Spec consistency
        run: pnpm check:spec-consistency

      - name: i18n key parity
        run: pnpm i18n:check

      - name: i18n hardcoded text audit
        run: pnpm i18n:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Electron build
        run: pnpm build:electron

      - name: Renderer build
        run: pnpm build:renderer

      - name: Upload renderer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renderer-dist
          path: dist/
          retention-days: 7
